<!doctype html>
<meta charset="utf-8">
<title>마을 모형 미리 보기</title>
<style>
  body { background: #2a3020; color: #d8c8a0; font: 12px sans-serif; margin: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .it { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  canvas { image-rendering: pixelated; }
</style>
<div id="out" class="row"></div>
<script type="module">
// 사용: ?sl=7&zoom=2&only=cathedral,smithy (sl: 16분의 몇)
import { townSprite, MODELS } from '../../js/render/townart.js';
const q = new URLSearchParams(location.search);
const sl = +(q.get('sl') || 7) / 16, Z = +(q.get('zoom') || 2), only = q.get('only')?.split(',');
const out = document.getElementById('out');
const t0 = performance.now();
const times = [];
for (const name of Object.keys(MODELS)) {
  if (only && !only.includes(name)) continue;
  const vars = name === 'tree' ? [0, 1, 2, 3, 4, 5] : name === 'tomb' ? [0, 1, 2] : name === 'fence' ? [0, 1] : name === 'barrel' || name === 'crate' ? [0, 1] : name === 'herbs' ? [0, 1, 2] : name === 'bench' ? [0, 1] : [0];
  for (const v of vars) {
    const t1 = performance.now();
    const s = townSprite(name, v, sl);
    times.push(`${name}${v}:${Math.round(performance.now() - t1)}`);
    const d = document.createElement('div'); d.className = 'it';
    const c = document.createElement('canvas'); c.width = s.w * Z; c.height = s.h * Z;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    // 바닥 마름모(칸 크기 비교용)
    g.fillStyle = 'rgba(80,100,50,1)';
    if (s.sh) g.drawImage(s.sh.cv, (s.ax - s.sh.ax) * Z, (s.ay - s.sh.ay) * Z, s.sh.cv.width * Z, s.sh.cv.height * Z);
    g.drawImage(s.cv, 0, 0, c.width, c.height);
    g.fillStyle = 'rgba(255,0,0,0.8)'; g.fillRect(s.ax * Z - 1, s.ay * Z - 1, 3, 3);
    d.appendChild(c); const sp = document.createElement('span'); sp.textContent = `${name}${v ? ' ' + v : ''}`; d.appendChild(sp); out.appendChild(d);
  }
}
console.log('bake ms', Math.round(performance.now() - t0), times.join(' '));
document.title = 'done';
</script>
